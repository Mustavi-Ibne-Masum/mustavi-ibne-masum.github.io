name: Update Google Scholar stats

on:
  schedule:
    - cron: "17 6 * * 1"   # every Monday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_scholar.py || true
      - name: Commit if changed
        run: |
          if ! git diff --quiet _data/scholar.yml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add _data/scholar.yml
            git commit -m "Update Google Scholar stats"
            git push
          fi
