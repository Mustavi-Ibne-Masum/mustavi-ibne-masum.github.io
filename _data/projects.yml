- group: "Graduate projects"
  years: "2025–2026"
  items:
    - name: "Open-pit mine production scheduler"
      text: "An interactive web game built on an open-pit mine production scheduling simulator. Players choose which blocks to extract and process each period, under slope precedence, capacity and grade constraints, to maximise net present value. Scores are compared against a greedy baseline on a verified leaderboard."
      links:
        - { label: "Live demo", url: "https://llm-milp-mining-web.vercel.app/" }
        - { label: "Code", url: "https://github.com/Mustavi-99/LLM-MILP-Mining" }
    - name: "Real-time ASL recognition system"
      text: "Real-time American Sign Language recognition using MediaPipe hand landmarks and a fully connected neural network."
      links:
        - { label: "Code", url: "https://github.com/Mustavi-99/Real-Time-ASL-Recognition-System" }
      video: "IstYhpTVqfM"
    - name: "Impact of DRO on noisy labels"
      text: "Investigating the impact of distributionally robust optimization on learning with noisy labels."
      links:
        - { label: "Code", url: "https://github.com/Mustavi-99/COMP-5422-FA25-CompVision-ImageAnalysis-G10" }

