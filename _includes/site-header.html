<header class="site-head">
  <div class="wrap site-head__inner">
    <a class="wordmark" href="{{ '/' | relative_url }}">{{ site.author.name }}</a>
    <nav class="nav" aria-label="Main">
      <button class="nav__toggle" type="button" aria-expanded="false" aria-controls="nav-list">Menu</button>
      <ul id="nav-list" class="nav__list">
        {% for link in site.data.navigation.main %}
          {% assign href = link.url | relative_url %}
          {% assign here = page.url | relative_url %}
          <li><a href="{{ href }}"{% if href == here %} aria-current="page"{% endif %}>{{ link.title }}</a></li>
        {% endfor %}
      </ul>
      <button class="theme-toggle" type="button" aria-label="Switch colour theme" title="Switch colour theme">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg>
      </button>
    </nav>
  </div>
</header>
